name: ForgeFlow AI — CI & Security Validation

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Build, Lint & Security Tests
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/forgeflow_test"
      DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/forgeflow_test"
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: "pk_test_ci_placeholder"
      CLERK_SECRET_KEY: "sk_test_ci_placeholder"
      ADMIN_EMAIL_1: ${{ secrets.ADMIN_EMAIL_1 || 'warishlabs@gmail.com' }}
      ADMIN_EMAIL_2: ${{ secrets.ADMIN_EMAIL_2 || 'warishdeveloper@gmail.com' }}
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: "0x4AAAAAAAAAAAAAAAAAAAAAAAAA"
      TURNSTILE_SECRET_KEY: "0x4AAAAAAAAAAAAAAAAAAAAAAAAA"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run Vitest Security & Unit Tests
        run: npm test

      - name: Type Check & Build Next.js App
        run: npm run build
